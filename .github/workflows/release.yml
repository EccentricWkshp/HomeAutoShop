# Publishes both images to Docker Hub, amd64 and arm64, as one manifest each.
#
# Built natively on each architecture rather than under QEMU. Emulating arm64
# would mean running apt, the PGDG client install and every pip build under
# translation — minutes become tens of minutes, and the failures it produces are
# emulator failures rather than real ones. GitHub's arm64 runners are free for
# public repositories, so there is nothing to trade off here.
#
# The build-then-merge shape is what makes that safe. Each architecture pushes
# an *untagged* digest, and only the merge job creates the tags that point at
# them. Nothing is visible to anyone pulling until the whole matrix has
# succeeded, so a failed arm64 build cannot leave a half-published release
# where `:latest` means amd64 today and both tomorrow.
#
# `workflow_dispatch` exists because v0.7.0 was tagged and pushed before this
# file did. Re-pushing a tag to trigger a workflow is a bad habit to build —
# a tag that changes meaning after people have pulled it is the one genuinely
# painful mistake available here — so the tag to publish is an input instead.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.7.0"
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  APP_REPO: docker.io/eccentricwkshp/homeautoshop
  PROXY_REPO: docker.io/eccentricwkshp/homeautoshop-caddy

jobs:
  app:
    name: App image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: homeautoshop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d homeautoshop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://shop:shop@127.0.0.1:5432/homeautoshop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # A tag is a claim about which release this is, and VERSION is what the
      # image will report for the rest of its life. If they disagree, one of
      # them is wrong and there is no way to tell which from here — so refuse,
      # rather than publish an image that misreports its own version.
      # The guard is also where the version comes from, so nothing downstream
      # has to choose between the tag and the file. They are proven equal one
      # line earlier, and the file's form is the one that wins: `0.7.0`, not
      # `v0.7.0`. The `v` belongs to git, not to the software — the registry
      # tags, the VERSION file and `homeautoshop.__version__` all read without
      # it, and a label that alone carried the prefix disagreed with every
      # other place the same number appears.
      - name: The tag and VERSION must agree
        id: version
        run: |
          want="${RELEASE_TAG#v}"
          have="$(cat VERSION)"
          if [ "$want" != "$have" ]; then
            echo "tag ${RELEASE_TAG} means ${want}, VERSION says ${have}" >&2
            exit 1
          fi
          echo "publishing ${have}"
          echo "value=${have}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Built and tested before it is pushed anywhere. arm64 is the reason: CI
      # only ever exercises amd64, so without this the first time an arm64 image
      # runs is on somebody's Raspberry Pi. Same arrangement as ci.yml — the
      # suite runs inside the image with the checkout mounted over /app, and as
      # the runner's user, because the image runs as uid 10001 and a corpus test
      # writes a fixture into a tree it would otherwise only be able to read.
      - name: Build for this architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homeautoshop:verify
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Gates and suite
        run: |
          gate() {
            echo "::group::manage.py $*"
            docker run --rm --network host -v "$PWD:/app" -u "$(id -u):$(id -g)" \
              -e HOME=/tmp -e DATABASE_URL="$DATABASE_URL" homeautoshop:verify \
              python manage.py "$@"
            echo "::endgroup::"
          }
          gate check_translations
          gate check_accessibility
          gate check_rtl
          gate build_catalog --check
          docker run --rm --network host -v "$PWD:/app" -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DATABASE_URL="$DATABASE_URL" \
            -e MEDIA_ROOT=/tmp/media -e BACKUP_DIR=/tmp/backups \
            homeautoshop:verify python manage.py test

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A cache hit on the build above, so this is a push and little else.
      # provenance is off deliberately: an attestation manifest alongside each
      # architecture confuses `imagetools create`, and a correct two-platform
      # manifest is worth more here than an SBOM nothing is yet reading.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.APP_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-app-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  proxy:
    name: Proxy image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Repeated from the app job rather than shared. It is six lines, and the
      # alternative is this job trusting that another one checked — across a
      # job boundary, where nothing enforces the order.
      - name: The tag and VERSION must agree
        id: version
        run: |
          want="${RELEASE_TAG#v}"
          have="$(cat VERSION)"
          if [ "$want" != "$have" ]; then
            echo "tag ${RELEASE_TAG} means ${want}, VERSION says ${have}" >&2
            exit 1
          fi
          echo "value=${have}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No separate verification step: the Dockerfile's last instruction fails
      # the build unless a DNS provider compiled in, which is the only question
      # this image has to answer.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.PROXY_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=proxy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=proxy-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-proxy-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag the manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [app, proxy]
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            repo: docker.io/eccentricwkshp/homeautoshop
            hub: eccentricwkshp/homeautoshop
            readme: README.md
            short: "HomeAutoShop is a record of vehicles and equipment for a home garage."
          - image: proxy
            repo: docker.io/eccentricwkshp/homeautoshop-caddy
            hub: eccentricwkshp/homeautoshop-caddy
            readme: docs/DOCKERHUB-CADDY.md
            short: "Caddy for HomeAutoShop - a record of vehicles and equipment for a home garage."

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Three tags for a release: the exact version, the series, and latest.
      # A pre-release gets the exact version and nothing else — somebody who
      # pulled `0.7` or `latest` asked for the newest thing considered ready,
      # and an -rc is by definition not that.
      - name: Create and tag the manifest list
        working-directory: /tmp/digests
        run: |
          count=$(find . -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no digests were collected for ${{ matrix.image }}" >&2
            exit 1
          fi
          echo "joining ${count} architectures"
          version="${RELEASE_TAG#v}"
          args="-t ${{ matrix.repo }}:${version}"
          case "$version" in
            *-*) echo "pre-release: tagging ${version} only" ;;
            *)   args="$args -t ${{ matrix.repo }}:${version%.*} -t ${{ matrix.repo }}:latest" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create $args \
            $(printf '${{ matrix.repo }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect "${{ matrix.repo }}:${RELEASE_TAG#v}"

      # Docker Hub renders the markdown but has no repository behind it, so
      # every relative link in the README — eleven of them — would resolve
      # against hub.docker.com and 404. They are rewritten to absolute GitHub
      # URLs on the way past rather than in the file itself, because in the
      # repository the relative ones are correct and are what GitHub renders.
      - name: Point relative links at GitHub
        run: |
          python3 - <<'PY'
          import pathlib, re
          BASE = "https://github.com/EccentricWkshp/HomeAutoShop"
          def fix(m):
              text, url = m.group(1), m.group(2)
              if url.startswith(("http://", "https://", "#", "mailto:")):
                  return m.group(0)
              kind = "tree" if url.endswith("/") else "blob"
              return f"[{text}]({BASE}/{kind}/main/{url})"
          src = pathlib.Path("${{ matrix.readme }}").read_text(encoding="utf-8")
          out = re.sub(r"\[([^\]]*)\]\(([^)]+)\)", fix, src)
          pathlib.Path("/tmp/hub.md").write_text(out, encoding="utf-8")
          # Counted outside the f-string: a backslash inside one is a syntax
          # error before Python 3.12, and the runner's version is not ours to
          # assume.
          total = len(re.findall(r"\]\(", src))
          rewritten = sum(1 for a, b in zip(src.splitlines(), out.splitlines()) if a != b)
          print(f"{total} links, {rewritten} lines rewritten")
          PY

      # Runs after the manifest is tagged, never before: a description
      # promising a release that failed to publish is worse than a stale one.
      #
      # DOCKERHUB_TOKEN must carry **read, write and delete** scope. Pushing an
      # image needs only write, so a read/write token publishes both images
      # perfectly and then fails here alone — which is exactly what 0.7.1 did,
      # and it is not a failure the error message explains. The narrower token
      # is the tempting choice and the one that does not work.
      #
      # Left able to fail the job rather than `continue-on-error`. The images
      # are already published by this point so nothing is broken by it, and a
      # description that quietly stopped syncing is the kind of thing nobody
      # notices for a year.
      - name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.hub }}
          readme-filepath: /tmp/hub.md
          short-description: ${{ matrix.short }}
