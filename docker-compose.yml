# HomeAutoShop — four services.
# Profiles: default (all four) · slim (jobs in-process) · dev (bind mounts).

name: homeautoshop

x-app: &app
  # Pulled, not built. `docker-compose.build.yml` puts the build back for
  # anyone who wants it — their own changes, an OCR language the published
  # image does not carry, or a DNS provider that is not compiled in:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.build.yml build
  #
  # `latest` on purpose, for now. The interfaces are still moving and an
  # instance that follows the newest release gets fixes without anybody
  # editing a file. That trade stops being right around 1.0, when an
  # unattended upgrade in the middle of a repair is the worse outcome; pin
  # earlier by setting HOMEAUTOSHOP_TAG=0.7.1 in .env.
  image: eccentricwkshp/homeautoshop:${HOMEAUTOSHOP_TAG:-latest}
  restart: unless-stopped
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:-shop}@db:5432/${POSTGRES_DB:-homeautoshop}
    # Photos and documents live on `media-data`, beside the database dump they
    # are backed up with. No object store is bundled: the one thing it would
    # buy is a presigned URL straight to the browser, and that is off by
    # default because it is a link anyone can use (mediafiles/views.py). An
    # operator who wants one anyway sets STORAGE_DRIVER=s3 and STORAGE_ENDPOINT
    # in .env and points them at their own.
    STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
    STATIC_HASHED: "true"
    MEDIA_ROOT: /data/media
    BACKUP_DIR: /data/backups
    # What the application asks Tesseract for. This and the packs the image
    # carries used to be one variable, which they can no longer be: with a
    # pulled image the installed set was decided by the published build, and
    # that is English. They do not need to agree — `_usable_languages`
    # narrows to the intersection and logs once what it dropped, because
    # Tesseract fails the whole call for one missing language rather than
    # skipping it (mediafiles/services.py). So asking for more than the image
    # has costs a warning, not OCR. Actually having more means building.
    OCR_LANGUAGES: ${TESSERACT_LANGS:-eng}
  volumes:
    - media-data:/data/media
    - backup-data:/data/backups
  depends_on:
    db: {condition: service_healthy}

services:
  proxy:
    # Caddy with DNS-01 providers compiled in, which the stock image cannot do:
    # every provider is a separate Go module and Caddy has no runtime plugin
    # loading. DNS-01 is the only challenge a LAN instance can pass. This used
    # to mean everyone compiled Caddy on first boot; now it is published, and
    # only somebody wanting a provider outside the four built in has to.
    image: eccentricwkshp/homeautoshop-caddy:${HOMEAUTOSHOP_TAG:-latest}
    restart: unless-stopped
    # Only what the *host* publishes changes here — Caddy always listens on 80
    # and 443 inside the container, so moving these needs no Caddy config and
    # no new certificate. A machine already running something on 80, which is
    # most machines that have ever hosted anything, sets HTTP_PORT=8080 and
    # HTTPS_PORT=8443 in .env and is done.
    #
    # HTTPS_PORT must agree with the port in BASE_URL. That is what QR labels
    # are printed from (core/labels.py) and what notification links use, and a
    # label carrying the wrong port is found by somebody scanning a bin months
    # later. The proxy says so at startup if the two disagree.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # All strategies are mounted; the entrypoint picks one from TLS_MODE and
      # refuses an unknown value by name. Interpolating TLS_MODE into the mount
      # path instead does not work: the engine creates a missing bind source as
      # a directory, so a typo becomes a stray folder and an obscure crash.
      - ./config/caddy:/etc/caddy/modes:ro
      - ./config/caddy/certs:/etc/caddy/certs:ro
      # For providers configured by file rather than by token — acmedns is one.
      - ./config/caddy/dns:/etc/caddy/dns:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-shop.home.arpa}
      TLS_MODE: ${TLS_MODE:-internal}
      # For the http:// → https:// redirect, which has to name a non-default
      # port or it sends the browser somewhere nothing is listening. And
      # BASE_URL only so the entrypoint can check the two agree.
      HTTPS_PORT: ${HTTPS_PORT:-443}
      BASE_URL: ${BASE_URL:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ACME_DNS_TOKEN: ${ACME_DNS_TOKEN:-}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    depends_on: [app]

  app:
    <<: *app
    # Migrations run under an advisory lock, so only one instance migrates.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 3 --timeout 120 --access-logfile - --pid /tmp/gunicorn.pid"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      # Checked often enough to notice the app is up. At a 30s interval the
      # container reported "starting" for half a minute after it was already
      # serving, which reads as a slow boot and is really a slow question.
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app
    command: python manage.py run_worker
    profiles: ["", "default"]
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      start_period: 5s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeautoshop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and wants
    # the mount one level up, at /var/lib/postgresql. Mounting the old
    # .../data path leaves the real data directory inside an anonymous volume
    # that disappears with the container, and the entrypoint refuses to start
    # rather than let that happen quietly. The parent mount is also what makes
    # a future `pg_upgrade --link` possible: both major versions then live in
    # the same volume instead of either side of a mount boundary.
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-homeautoshop}"]
      # Postgres is ready in about a second; a 10s interval meant everything
      # downstream waited ten for the first question to be asked.
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

volumes:
  db-data:
  media-data:
  backup-data:
  caddy-data:
  caddy-config:
