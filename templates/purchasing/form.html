{% extends "base.html" %}{% load i18n %}
{% block content %}
<h1>{% translate "New order" %}</h1>
<form method="post" class="card">{% csrf_token %}
  <div class="formgrid">
    {% for field in form %}
      <div class="field {% if field.name == 'notes' %}full{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}
      </div>
    {% endfor %}
  </div>
  <button class="primary" type="submit">{% translate "Create" %}</button>
</form>
{% endblock %}
