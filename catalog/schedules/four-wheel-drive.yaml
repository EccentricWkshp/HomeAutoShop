name: Four-wheel drive extras
slug: four-wheel-drive
author: HomeAutoShop
description: >-
  The driveline items a two-wheel-drive schedule has no reason to mention:
  transfer case, front differential, front axle and hubs. Meant to be applied
  alongside a normal or severe schedule rather than instead of one, since it
  covers what the others leave out. Generic intervals; check them against your
  own owner's manual, and shorten all of them if the vehicle sees water, mud or
  salt, every one of which gets into a transfer case.
asset_kinds:
  - vehicle
vehicle_classes:
  - truck
  - suv
