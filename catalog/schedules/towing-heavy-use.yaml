name: Towing and heavy hauling
slug: towing-heavy-use
author: HomeAutoShop
description: >-
  For a truck or SUV that tows a trailer, carries a camper, or spends its life
  loaded. Heat is what shortens these intervals — automatic transmission fluid
  and differential oil age far faster under load than mileage alone suggests,
  and brakes do the work of a much heavier vehicle. Generic and conservative;
  check against your own owner's manual, which will usually have a towing
  column of its own.
asset_kinds:
  - vehicle
vehicle_classes:
  - truck
  - suv
