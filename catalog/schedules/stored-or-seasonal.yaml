name: Stored or seasonal vehicle
slug: stored-or-seasonal
author: HomeAutoShop
description: >-
  A classic, a convertible, a project, or anything that spends most of the year
  parked. Deliberately has no distance intervals at all: a vehicle covering
  four hundred miles a year will never reach a mileage service, while its brake
  fluid still absorbs water, its tires still age out, and its fuel still goes
  stale on exactly the same calendar as everybody else's. Generic; check
  against your owner's manual.
asset_kinds:
  - vehicle
