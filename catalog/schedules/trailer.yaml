name: Trailer
slug: trailer
author: HomeAutoShop
description: >-
  A utility, boat, or equipment trailer. No engine, so nothing here is an
  engine service. What fails on a trailer is bearings, brakes, tires and
  lights, and it fails at speed with somebody's boat behind it. Distance is
  towed miles. Generic; check against the axle manufacturer's figures, which
  are usually stricter than the trailer builder's.
asset_kinds:
  - equipment
