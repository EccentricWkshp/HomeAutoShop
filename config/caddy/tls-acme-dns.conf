# A real, publicly-trusted certificate — nothing to install on any device.
#
# DNS-01 proves control of the name by writing a TXT record, so the instance
# never has to be reachable from the internet. The hostname does not even need
# a public A record: keep it in local DNS only and the address of the machine
# stays private.
tls {$ACME_EMAIL} {
	dns {$ACME_DNS_PROVIDER} {$ACME_DNS_TOKEN}

	# Ask public resolvers about the challenge record, not the LAN's. A local
	# resolver serving a split-horizon view of the zone will not see the TXT
	# record Caddy just wrote, and the wait for it never ends.
	resolvers 1.1.1.1 9.9.9.9

	# Point at the staging CA while setting this up. The production endpoint
	# allows five identical certificates a week and a mistake costs you the
	# rest of it. Staging certificates are untrusted by design — that is the
	# expected result, and it proves the challenge itself works.
	ca {$ACME_CA:https://acme-v02.api.letsencrypt.org/directory}
}
